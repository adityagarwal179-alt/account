<!doctype html><html lang="en"><head><meta charset="utf-8"><title>KhataBook Pro – Admin</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="config.js"></script>
<style>
:root{--bg:#eef3f0;--c:#fff;--t:#14201b;--m:#5f6f67;--p:#0f6b4f;--p2:#dff1ea;--r:#c2352f;--r2:#fbe7e5;--a:#b7791f;--b:#d9e2dd;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0e1512;--c:#17211c;--t:#e6efea;--m:#93a79c;--p:#3fcf9f;--p2:#133126;--r:#ff7b73;--r2:#3a1f1d;--a:#e8b04a;--b:#26352d}}
:root[data-theme=dark]{--bg:#0e1512;--c:#17211c;--t:#e6efea;--m:#93a79c;--p:#3fcf9f;--p2:#133126;--r:#ff7b73;--r2:#3a1f1d;--a:#e8b04a;--b:#26352d}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans","Noto Sans Devanagari",sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--c);z-index:10}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--c);border-bottom:1px solid var(--b);padding:10px 14px}
.hr{display:flex;justify-content:space-between;align-items:center;gap:8px}.hr h1{font-size:18px;margin:0}
nav{display:flex;gap:4px;overflow-x:auto;margin-top:8px}nav button{white-space:nowrap}
main{max-width:860px;margin:0 auto;padding:14px}
button,input,select,textarea{font:inherit;color:inherit}
button{border:1px solid var(--b);background:var(--c);border-radius:8px;padding:7px 12px;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--p);outline-offset:1px}
button.on,button.pri{background:var(--p);color:#fff;border-color:var(--p)}button.dng{color:var(--r);border-color:var(--r)}
input,select,textarea{width:100%;padding:8px 10px;border:1px solid var(--b);border-radius:8px;background:var(--bg);margin:3px 0 10px}
label{font-size:13px;color:var(--m)}
.card{background:var(--c);border:1px solid var(--b);border-radius:10px;padding:12px;margin-bottom:10px}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.k{font-size:12px;color:var(--m)}.big{font-size:22px;font-weight:700}
.due{color:var(--r)}.adv{color:var(--p)}.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.wrap{display:flex;gap:6px;flex-wrap:wrap}.chip{font-size:12px;padding:2px 8px;border-radius:99px;background:var(--p2);color:var(--p)}
.chip.w{background:var(--r2);color:var(--r)}.pl{cursor:pointer}.bars{display:flex;gap:8px;align-items:flex-end;height:90px}
.bars div{flex:1;text-align:center;font-size:11px;color:var(--m)}.bars i{display:inline-block;width:42%;vertical-align:bottom}
.mo{position:fixed;inset:0;background:#0007;z-index:20;display:flex;align-items:flex-end;justify-content:center}.mo[hidden]{display:none}
.md{background:var(--c);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:14px 14px 0 0;padding:16px}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--t);color:var(--bg);padding:8px 14px;border-radius:8px;z-index:30}
#toast[hidden]{display:none}a.btn{display:inline-block;text-decoration:none;border:1px solid var(--b);border-radius:8px;padding:7px 12px;color:inherit}
#pr{display:none}@media print{body>*:not(#pr){display:none!important}#pr{display:block;color:#000;background:#fff;padding:12px}#pr td,#pr th{border-bottom:1px solid #ccc;padding:4px 8px;text-align:left}}
</style></head><body>
<header><div class="hr"><h1 id="sn"></h1><span class="k" id="hst"></span></div><nav id="nav"></nav></header>
<main id="app"></main><div class="mo" id="mo" hidden><div class="md" id="mb"></div></div><div id="toast" hidden></div><div id="pr"></div>
<script>
const $=s=>document.querySelector(s),K='khata_pro_v1';
let S=null;try{S=JSON.parse(localStorage.getItem(K))}catch(e){}
S=S||{cloud:{email:'',site:''},shop:{name:'My Shop',upi:'',phone:'',pin:'',lang:'en',tone:0,theme:''},parties:[],entries:[],disputes:[],log:[]};
S.claims=S.claims||[];S.disputes=S.disputes||[];S.log=S.log||[];
let tab='home',rp='30',q='',flt='all',srt='bal',portal=null,unlocked=false,tt;
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){toast('Storage is full or blocked')}if(typeof sched==='function')sched()};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>(n<0?'-':'')+'₹'+Math.abs(+n||0).toLocaleString('en-IN',{minimumFractionDigits:Number.isInteger(Math.round(Math.abs(+n||0)*100)/100)?0:2,maximumFractionDigits:2});
const today=()=>new Date().toISOString().slice(0,10);
const log=m=>{S.log.unshift({t:new Date().toLocaleString(),m});S.log=S.log.slice(0,100)};
const ents=id=>S.entries.filter(e=>e.pid===id&&!e.del);
const bal=id=>ents(id).reduce((a,e)=>a+(e.type==='give'?e.amt:-e.amt),0);
const P=id=>S.parties.find(p=>p.id===id),live=()=>S.parties.filter(p=>!p.del);
const overdue=p=>bal(p.id)>0&&ents(p.id).some(e=>e.type==='give'&&e.due&&e.due<today());
const sg=e=>e.type==='give'?e.amt:-e.amt,advOf=id=>Math.max(0,-bal(id)),lbl=e=>e.kind==='adv'?'Advance received':e.kind==='refund'?'Advance refunded':e.type==='give'?'Gave':'Got',dayAgo=n=>new Date(Date.now()-n*864e5).toISOString().slice(0,10);
const dg=s=>String(s||'').replace(/\D/g,''),wan=s=>{let d=dg(s);if(d.length===10)d='91'+d;return d};
function toast(m){const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(tt);tt=setTimeout(()=>t.hidden=true,2400)}
function openM(h){$('#mb').innerHTML=h;$('#mo').hidden=false}function closeM(){$('#mo').hidden=true}
$('#mo').addEventListener('click',e=>{if(e.target.id==='mo')closeM()});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeM()});
const T={en:["Hi {n}, a gentle reminder: ₹{a} is pending at {s}. Please pay when convenient. Thank you!","Dear {n}, your outstanding balance at {s} is ₹{a}. Kindly clear it at the earliest.","{n}, ₹{a} is overdue at {s}. Please pay today to avoid further follow-up."],
hg:["Namaste {n}, {s} mein aapka ₹{a} baaki hai. Suvidha anusaar payment kar dein. Dhanyavaad!","Dear {n}, {s} mein aapka bakaya ₹{a} hai. Kripya jaldi payment karein.","{n}, {s} ka ₹{a} due hai. Kripya aaj hi payment karein."],
hi:["नमस्ते {n}, {s} में आपका ₹{a} बाकी है। सुविधा अनुसार भुगतान कर दें। धन्यवाद!","प्रिय {n}, {s} में आपका बकाया ₹{a} है। कृपया जल्द भुगतान करें।","{n}, {s} में ₹{a} की राशि देय है। कृपया आज ही भुगतान करें।"],
pa:["ਸਤ ਸ੍ਰੀ ਅਕਾਲ {n}, {s} ਵਿੱਚ ਤੁਹਾਡਾ ₹{a} ਬਾਕੀ ਹੈ। ਸਹੂਲਤ ਅਨੁਸਾਰ ਭੁਗਤਾਨ ਕਰ ਦਿਓ। ਧੰਨਵਾਦ!","ਪਿਆਰੇ {n}, {s} ਵਿੱਚ ਤੁਹਾਡਾ ਬਕਾਇਆ ₹{a} ਹੈ। ਕਿਰਪਾ ਕਰਕੇ ਜਲਦੀ ਭੁਗਤਾਨ ਕਰੋ।","{n}, {s} ਦਾ ₹{a} ਦੇਣਾ ਬਾਕੀ ਹੈ। ਕਿਰਪਾ ਕਰਕੇ ਅੱਜ ਹੀ ਭੁਗਤਾਨ ਕਰੋ।"],
gu:["નમસ્તે {n}, {s} માં તમારા ₹{a} બાકી છે. અનુકૂળતાએ ચૂકવી દેજો. આભાર!","પ્રિય {n}, {s} માં તમારું બાકી ₹{a} છે. કૃપા કરીને જલદી ચૂકવો.","{n}, {s} ના ₹{a} ચૂકવવાના બાકી છે. કૃપા કરીને આજે જ ચૂકવો."],
mr:["नमस्कार {n}, {s} येथे तुमचे ₹{a} बाकी आहेत. सोयीने भरा. धन्यवाद!","प्रिय {n}, {s} येथील तुमची थकबाकी ₹{a} आहे. कृपया लवकर भरा.","{n}, {s} चे ₹{a} देय आहेत. कृपया आजच भरा."],
bn:["নমস্কার {n}, {s}-এ আপনার ₹{a} বাকি আছে। সুবিধামতো পরিশোধ করুন। ধন্যবাদ!","প্রিয় {n}, {s}-এ আপনার বকেয়া ₹{a}। অনুগ্রহ করে শীঘ্র পরিশোধ করুন।","{n}, {s}-এর ₹{a} বকেয়া। অনুগ্রহ করে আজই পরিশোধ করুন।"],
ta:["வணக்கம் {n}, {s} கடையில் உங்கள் ₹{a} நிலுவை உள்ளது. வசதிப்படி செலுத்தவும். நன்றி!","அன்புள்ள {n}, {s} கடையில் உங்கள் நிலுவை ₹{a}. தயவுசெய்து விரைவில் செலுத்தவும்.","{n}, {s} கடைக்கு ₹{a} செலுத்த வேண்டியுள்ளது. இன்றே செலுத்தவும்."],
te:["నమస్కారం {n}, {s} లో మీ ₹{a} బాకీ ఉంది. వీలైనప్పుడు చెల్లించండి. ధన్యవాదాలు!","ప్రియమైన {n}, {s} లో మీ బకాయి ₹{a}. దయచేసి త్వరగా చెల్లించండి.","{n}, {s} కు ₹{a} చెల్లించాలి. దయచేసి ఈరోజే చెల్లించండి."]};
const LN={en:'English',hi:'हिन्दी',hg:'Hinglish',pa:'ਪੰਜਾਬੀ',gu:'ગુજરાતી',mr:'मराठी',bn:'বাংলা',ta:'தமிழ்',te:'తెలుగు'},TN=['Friendly','Polite','Firm'];
const msg=(p,l,t)=>{let s=T[l][t].replace(/\{n\}/g,p.name).replace(/\{a\}/g,Math.abs(bal(p.id)).toLocaleString('en-IN')).replace(/\{s\}/g,S.shop.name);if(S.shop.upi)s+='\nUPI: '+S.shop.upi;const cl2=cLink(p);if(cl2)s+='\n\nPoora ya thoda payment yahan se kar sakte hain / Pay full or part here:\n'+cl2;return s};
const sel=(o,v)=>Object.entries(o).map(([k,n])=>`<option value="${k}"${String(k)===String(v)?' selected':''}>${esc(n)}</option>`).join('');
const upiAscii=(t,d,n)=>{t=String(t||'').normalize('NFKD').replace(/[^A-Za-z0-9 ]/g,' ').replace(/\s+/g,' ').trim().slice(0,n);return t||d};
const upi=(amt,note)=>`upi://pay?pa=${encodeURIComponent(String(S.shop.upi).trim())}&pn=${encodeURIComponent(upiAscii(S.shop.name,'Shop',25))}${amt?'&am='+(Number.isInteger(+amt)?+amt:(+amt).toFixed(2)):''}&cu=INR${note?'&tn='+encodeURIComponent(upiAscii(note,'Khata payment',30)):''}`;
function qr(id,text,size){const el=document.getElementById(id);if(!el)return;el.innerHTML='';if(!S.shop.upi){el.innerHTML='<span class="k">Add your UPI ID in Settings to show the QR.</span>';return}
if(typeof QRCode==='undefined'){el.innerHTML='<span class="k">QR library could not load. Check your connection.</span>';return}try{new QRCode(el,{text,width:size,height:size,correctLevel:QRCode.CorrectLevel.M})}catch(e){el.textContent='QR error'}}
const TABS=[['home','Home'],['cust','Customers'],['pay','Payments'],['disp','Disputes'],['rep','Reports'],['qr','Shop QR'],['set','Settings']];
function render(){
 document.documentElement.dataset.theme=S.shop.theme||'';$('#sn').textContent=S.shop.name;const m=$('#app'),nv=$('#nav');
 if(S.shop.pin&&!unlocked){nv.hidden=true;m.innerHTML=`<div class="card"><h2>Shop locked</h2><label>Enter PIN</label><input id="pn" type="password" inputmode="numeric" onkeydown="if(event.key==='Enter')unlock()"><button class="pri" onclick="unlock()">Unlock</button></div>`;return}
 nv.hidden=false;const pd=S.disputes.filter(d=>d.status==='pending').length,pc=S.claims.filter(c=>c.status==='pending'&&P(c.pid)&&!P(c.pid).del).length;
 nv.innerHTML=TABS.map(([k,n])=>`<button class="${tab===k?'on':''}" onclick="tab='${k}';render()">${n}${k==='disp'&&pd?' ('+pd+')':''}${k==='pay'&&pc?' ('+pc+')':''}</button>`).join('');
 m.innerHTML={home:homeH,cust:custH,pay:payH,disp:dispH,rep:repH,qr:qrH,set:setH}[tab]();if(tab==='qr')qr('mq',upi(0,''),220);
}
function unlock(){if($('#pn').value===S.shop.pin){unlocked=true;render()}else toast('Wrong PIN')}
function homeH(){const ps=live(),rec=ps.reduce((a,p)=>a+Math.max(0,bal(p.id)),0),adv=ps.reduce((a,p)=>a+Math.max(0,-bal(p.id)),0);
 const E=S.entries.filter(e=>!e.del),sm=(d,t)=>E.filter(e=>e.date===d&&e.type===t).reduce((a,e)=>a+e.amt,0);
 const days=[...Array(7)].map((_,i)=>{const d=new Date(Date.now()-(6-i)*864e5).toISOString().slice(0,10);return{d:d.slice(5),g:sm(d,'give'),r:sm(d,'got')}});const mx=Math.max(1,...days.flatMap(x=>[x.g,x.r]));
 const top=ps.filter(p=>bal(p.id)>0).sort((a,b)=>bal(b.id)-bal(a.id)).slice(0,5);
 return `${bkBanner()}${payBanner()}<div class="g"><div class="card"><div class="k">You will get</div><div class="big due">${fmt(rec)}</div></div><div class="card"><div class="k">Advance held (credit)</div><div class="big adv">${fmt(adv)}</div></div>
 <div class="card"><div class="k">Customers</div><div class="big">${ps.length}</div></div><div class="card"><div class="k">Overdue customers</div><div class="big">${ps.filter(overdue).length}</div></div>
 <div class="card"><div class="k">Given today</div><div class="big">${fmt(sm(today(),'give'))}</div></div><div class="card"><div class="k">Received today</div><div class="big adv">${fmt(sm(today(),'got'))}</div></div></div>
 <div class="card"><b>Last 7 days</b> <span class="k">(red: given, green: received)</span><div class="bars">${days.map(x=>`<div><i style="height:${x.g/mx*70}px;background:var(--r)"></i><i style="height:${x.r/mx*70}px;background:var(--p)"></i><br>${x.d}</div>`).join('')}</div></div>
 <div class="card"><b>Top dues</b>${top.length?top.map(p=>`<div class="row pl" onclick="openP('${p.id}')"><span>${esc(p.name)}</span><span class="due">${fmt(bal(p.id))}</span></div>`).join(''):'<p class="k">No dues. Add a customer to start your khata.</p>'}</div>
 ${(()=>{const a=ps.filter(p=>p.promise&&p.promise<=today()&&bal(p.id)>0);return a.length?'<div class="card"><b>Promises due</b>'+a.map(p=>`<div class="row pl" onclick="openP('${p.id}')"><span>${esc(p.name)}</span><span class="${p.promise<today()?'due':''}">${p.promise}</span></div>`).join('')+'</div>':''})()}
 <div class="wrap"><button class="pri" onclick="partyM()">+ Add customer</button><button onclick="bulkM()">Remind all due</button><button onclick="linksM()">Send customer links</button><button onclick="sumM()">Daily summary</button></div>`}
function custH(){return `<div class="row"><input id="sq" placeholder="Search name or phone" value="${esc(q)}" oninput="q=this.value;$('#lst').innerHTML=listH()"><button class="pri" style="white-space:nowrap" onclick="partyM()">+ Add</button></div>
 <div class="wrap" style="margin-bottom:10px"><select style="width:auto" onchange="flt=this.value;$('#lst').innerHTML=listH()">${sel({all:'All',due:'Has due',over:'Overdue',risk:'High risk',clear:'Settled',adv:'Has advance'},flt)}</select><select style="width:auto" onchange="srt=this.value;$('#lst').innerHTML=listH()">${sel({bal:'Highest due',name:'Name A–Z',new:'Newest'},srt)}</select><button onclick="bulkM()">Remind all due</button><button onclick="linksM()">Send customer links</button></div><div id="lst">${listH()}</div>`}
function listH(){let a=live().filter(p=>(p.name+p.phone).toLowerCase().includes(q.toLowerCase()));
 if(flt==='due')a=a.filter(p=>bal(p.id)>0);if(flt==='clear')a=a.filter(p=>bal(p.id)===0);if(flt==='adv')a=a.filter(p=>bal(p.id)<0);if(flt==='risk')a=a.filter(p=>risk(p)[0]==='High risk');if(flt==='over')a=a.filter(overdue);
 a.sort(srt==='name'?(x,y)=>x.name.localeCompare(y.name):srt==='new'?(x,y)=>y.created-x.created:(x,y)=>bal(y.id)-bal(x.id));
 return a.length?a.map(p=>{const b=bal(p.id);return `<div class="card pl row" onclick="openP('${p.id}')"><div><b>${esc(p.name)}</b> ${overdue(p)?'<span class="chip w">Overdue</span>':''} ${riskChip(p)}<div class="k">${esc(p.phone)}</div></div><div><b class="${b>0?'due':'adv'}">${fmt(Math.abs(b))}</b><div class="k">${b>0?'You will get':b<0?'Advance credit':'Settled'}</div></div></div>`}).join(''):'<div class="card k">No customers match. Tap Add to create one.</div>'}
function partyM(id){const p=id?P(id):{name:'',phone:'',addr:'',lang:S.shop.lang,limit:'',notes:''};
 openM(`<h3>${id?'Edit':'Add'} customer</h3><label>Name</label><input id="f1" value="${esc(p.name)}"><label>Phone (with or without +91)</label><input id="f2" inputmode="tel" value="${esc(p.phone)}"><label>Address</label><input id="f3" value="${esc(p.addr)}">
 <label>Reminder language</label><select id="f4">${sel(LN,p.lang)}</select><label>Credit limit (optional)</label><input id="f5" type="number" min="0" value="${esc(p.limit)}"><label>Notes</label><textarea id="f6">${esc(p.notes)}</textarea>
 ${id?'':'<label>Opening balance (optional)</label><div class="row"><select id="f8" style="flex:1">'+sel({owe:'Customer owes me (udhaar)',adv:'Customer paid in advance (credit)'},'owe')+'</select><input id="f7" type="number" min="0" step="0.01" placeholder="Amount" style="flex:1"></div>'}<div class="wrap"><button class="pri" onclick="saveP('${id||''}')">Save</button><button onclick="closeM()">Cancel</button></div>`)}
function saveP(id){const n=$('#f1').value.trim(),ph=$('#f2').value.trim();if(!n)return toast('Enter a name');if(dg(ph).length<10)return toast('Enter a valid 10-digit phone');const ob0=+(($('#f7')||{}).value||0);if(!(ob0>=0))return toast('Opening balance must be 0 or more');
 if(live().some(x=>x.id!==id&&dg(x.phone).slice(-10)===dg(ph).slice(-10)))return toast('This phone already exists');
 const v={name:n,phone:ph,addr:$('#f3').value.trim(),lang:$('#f4').value,limit:+$('#f5').value||0,notes:$('#f6').value.trim()};
 if(id)Object.assign(P(id),v);else{const np={id:uid(),created:Date.now(),token:tk(),...v};S.parties.push(np);const ob=Math.round(ob0*100)/100;if(ob>0){const ad=($('#f8')||{}).value==='adv';S.entries.push({id:uid(),pid:np.id,type:ad?'got':'give',kind:ad?'adv':'',amt:ob,date:today(),due:'',note:ad?'Opening advance':'Opening balance',mode:'cash'})}id=np.id}
 log((id?'Saved ':'Added ')+'customer '+n);save();closeM();render();toast('Customer saved')}

function syncNow(){syncAll(true).then(()=>linksM())}
function linksM(){const a=live().filter(p=>dg(p.phone).length>=10);a.forEach(p=>{p.token=p.token||tk()});save0();
 openM(`<h3>Send customer links</h3><p class="k">Every customer has a different private link. Tap WhatsApp next to a name – the message is ready, you only press Send.</p>${ready()?`<div class="row"><span class="k">${esc(cState||'Online sync connected')}</span><button onclick="syncNow()">Sync now</button></div>`:'<p class="k due">Online sync is not connected yet. Connect it in Settings first, or the links will not open.</p>'}${siteOk()?'':'<p class="k due">Customer site URL is not set (Settings → Online customer links). Links will be wrong until you set it.</p>'}${a.length?a.map(p=>`<div class="card row"><div><b>${esc(p.name)}</b> <span class="chip sc"${p.linkSent?'':' hidden'}>Sent</span> ${pushed[p.id]&&pushed[p.id]!=='x'?'<span class="chip">Online</span>':'<span class="chip w">Not synced</span>'}<div class="k">${esc(p.phone)}</div></div><div class="wrap"><a class="btn" target="_blank" rel="noopener" onclick="markSent('${p.id}',this)" href="https://wa.me/${wan(p.phone)}?text=${encodeURIComponent(linkMsg(p))}">WhatsApp</a><button onclick="cp(linkMsg(P('${p.id}')))">Copy</button></div></div>`).join(''):'<p class="k">No customers with a phone number yet.</p>'}<button onclick="closeM()">Close</button>`);sched()}
function linkM(id){const p=P(id),t=linkMsg(p);save0();
 openM(`<h3>Customer link</h3><p class="k">Private link for ${esc(p.name)}. Send it only to them.</p>${ready()?'':'<p class="k due">Online sync is not connected yet. Connect it in Settings so this link works.</p>'}${siteOk()?'':'<p class="k due">Customer site URL is not set in Settings.</p>'}<textarea id="lk1" rows="5" readonly>${esc(t)}</textarea><div class="wrap"><a class="btn" target="_blank" rel="noopener" onclick="markSent('${id}',this)" href="https://wa.me/${wan(p.phone)}?text=${encodeURIComponent(t)}">WhatsApp</a><button onclick="cp($('#lk1').value)">Copy</button><button class="dng" onclick="newTok('${id}')">New link (disables old)</button><button onclick="openP('${id}')">Back</button></div>`);sched()}
async function newTok(id){if(!confirm('The old link will stop working. Continue?'))return;const p=P(id),old=p.token;p.token=tk();delete pushed[id];save();if(ready()){try{await fsReq('DELETE',FS()+'/pub/'+old)}catch(e){}}linkM(id)}

render();
if(ready())syncAll();setInterval(()=>{if(ready())syncAll()},60000);
</script></body></html>
