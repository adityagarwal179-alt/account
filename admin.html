<script>
const $=s=>document.querySelector(s),K='khata_pro_v1';
let S=null;try{S=JSON.parse(localStorage.getItem(K))}catch(e){}
S=S||{cloud:{email:'',site:''},shop:{name:'My Shop',upi:'',phone:'',pin:'',lang:'en',tone:0,theme:''},parties:[],entries:[],disputes:[],log:[]};

const dmy=s=>{const m=String(s||'').match(/^(\d{4})-(\d{2})-(\d{2})/);return m?m[3]+'-'+m[2]+'-'+m[1]:String(s||'')},dts=v=>{const d=new Date(v);if(isNaN(d))return '';const p=n=>String(n).padStart(2,'0');return p(d.getDate())+'-'+p(d.getMonth()+1)+'-'+d.getFullYear()+' '+p(d.getHours())+':'+p(d.getMinutes())};
const lday=t=>{const d=new Date(t),p=n=>String(n).padStart(2,'0');return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())};

const pruneLog=()=>{const c=Date.now()-3*36e5;S.log=(S.log||[]).filter(l=>l&&l.u>=c)};
const log=m=>{pruneLog();S.log.unshift({t:dts(Date.now()),m,u:Date.now()});S.log=S.log.slice(0,100)};
const ents=id=>S.entries.filter(e=>e.pid===id&&!e.del);
const bal=id=>ents(id).reduce((a,e)=>a+(e.type==='give'?e.amt:-e.amt),0);
const P=id=>S.parties.find(p=>p.id===id),live=()=>S.parties.filter(p=>!p.del);

const T={en:["Hi {n}, a gentle reminder: ₹{a} is pending at {s}. Please pay when convenient. Thank you!","Dear {n}, your outstanding balance at {s} is ₹{a}. Kindly clear it at the earliest.","{n}, ₹{a} is overdue at {s}. Please pay today to avoid further follow-up."],

hi:["नमस्ते {n}, {s} में आपका ₹{a} बाकी है। सुविधा अनुसार भुगतान कर दें। धन्यवाद!","प्रिय {n}, {s} में आपका बकाया ₹{a} है। कृपया जल्द भुगतान करें।","{n}, {s} में ₹{a} की राशि देय है। कृपया आज ही भुगतान करें।"],
pa:["ਸਤ ਸ੍ਰੀ ਅਕਾਲ {n}, {s} ਵਿੱਚ ਤੁਹਾਡਾ ₹{a} ਬਾਕੀ ਹੈ। ਸਹੂਲਤ ਅਨੁਸਾਰ ਭੁਗਤਾਨ ਕਰ ਦਿਓ। ਧੰਨਵਾਦ!","ਪਿਆਰੇ {n}, {s} ਵਿੱਚ ਤੁਹਾਡਾ ਬਕਾਇਆ ₹{a} ਹੈ। ਕਿਰਪਾ ਕਰਕੇ ਜਲਦੀ ਭੁਗਤਾਨ ਕਰੋ।","{n}, {s} ਦਾ ₹{a} ਦੇਣਾ ਬਾਕੀ ਹੈ। ਕਿਰਪਾ ਕਰਕੇ ਅੱਜ ਹੀ ਭੁਗਤਾਨ ਕਰੋ।"],
gu:["નમસ્તે {n}, {s} માં તમારા ₹{a} બાકી છે. અનુકૂળતાએ ચૂકવી દેજો. આભાર!","પ્રિય {n}, {s} માં તમારું બાકી ₹{a} છે. કૃપા કરીને જલદી ચૂકવો.","{n}, {s} ના ₹{a} ચૂકવવાના બાકી છે. કૃપા કરીને આજે જ ચૂકવો."],
mr:["नमस्कार {n}, {s} येथे तुमचे ₹{a} बाकी आहेत. सोयीने भरा. धन्यवाद!","प्रिय {n}, {s} येथील तुमची थकबाकी ₹{a} आहे. कृपया लवकर भरा.","{n}, {s} चे ₹{a} देय आहेत. कृपया आजच भरा."],
bn:["নমস্কার {n}, {s}-এ আপনার ₹{a} বাকি আছে। সুবিধামতো পরিশোধ করুন। ধন্যবাদ!","প্রিয় {n}, {s}-এ আপনার বকেয়া ₹{a}। অনুগ্রহ করে শীঘ্র পরিশোধ করুন।","{n}, {s}-এর ₹{a} বকেয়া। অনুগ্রহ করে আজই পরিশোধ করুন।"],
ta:["வணக்கம் {n}, {s} கடையில் உங்கள் ₹{a} நிலுவை உள்ளது. வசதிப்படி செலுத்தவும். நன்றி!","அன்புள்ள {n}, {s} கடையில் உங்கள் நிலுவை ₹{a}. தயவுசெய்து விரைவில் செலுத்தவும்.","{n}, {s} கடைக்கு ₹{a} செலுத்த வேண்டியுள்ளது. இன்றே செலுத்தவும்."],
te:["నమస్కారం {n}, {s} లో మీ ₹{a} బాకీ ఉంది. వీలైనప్పుడు చెల్లించండి. ధన్యవాదాలు!","ప్రియమైన {n}, {s} లో మీ బకాయి ₹{a}. దయచేసి త్వరగా చెల్లించండి.","{n}, {s} కు ₹{a} చెల్లించాలి. దయచేసి ఈరోజే చెల్లించండి."]};
const LN={en:'English',hi:'हिन्दी',hg:'Hinglish',pa:'ਪੰਜਾਬੀ',gu:'ગુજરાતી',mr:'मराठी',bn:'বাংলা',ta:'தமிழ்',te:'తెలుగు'},TN=['Friendly','Polite','Firm'];
const msg=(p,l,t)=>{let s=T[l][t].replace(/\{n\}/g,p.name).replace(/\{a\}/g,Math.abs(bal(p.id)).toLocaleString('en-IN')).replace(/\{s\}/g,S.shop.name);if(S.shop.upi)s+='\nUPI: '+S.shop.upi;const cl2=cLink(p);if(cl2)s+='\n\nPoora ya thoda payment yahan se kar sakte hain / Pay full or part here:\n'+cl2;return s};
const sel=(o,v)=>Object.entries(o).map(([k,n])=>`<option value="${k}"${String(k)===String(v)?' selected':''}>${esc(n)}</option>`).join('');
const upiAscii=(t,d,n)=>{t=String(t||'').normalize('NFKD').replace(/[^A-Za-z0-9 ]/g,' ').replace(/\s+/g,' ').trim().slice(0,n);return t||d};
const upi=(amt,note)=>`upi://pay?pa=${encodeURIComponent(String(S.shop.upi).trim())}&pn=${encodeURIComponent(upiAscii(S.shop.name,'Shop',25))}${amt?'&am='+(Number.isInteger(+amt)?+amt:(+amt).toFixed(2)):''}&cu=INR${S.shop.mc?'&mc='+S.shop.mc:''}${note?'&tn='+encodeURIComponent(upiAscii(note,'Khata payment',30)):''}`;
function qr(id,text,size){const el=document.getElementById(id);if(!el)return;el.innerHTML='';if(!S.shop.upi){el.innerHTML='<span class="k">Add your UPI ID in Settings to show the QR.</span>';return}
if(typeof QRCode==='undefined'){el.innerHTML='<span class="k">QR library could not load. Check your connection.</span>';return}try{const wrap=document.createElement('div');wrap.className='qrbox';wrap.style.cssText='background:#fff;padding:16px;border-radius:12px;display:inline-block;line-height:0;max-width:100%';el.appendChild(wrap);const z=Math.max(size,240);new QRCode(wrap,{text,width:z,height:z,correctLevel:QRCode.CorrectLevel.M})}catch(e){el.textContent='QR error'}}
function togTheme(){const dk=document.documentElement.dataset.theme==='dark'||(!S.shop.theme&&matchMedia('(prefers-color-scheme:dark)').matches);S.shop.theme=dk?'light':'dark';save0();render()}
document.addEventListener('keydown',e=>{if(/INPUT|TEXTAREA|SELECT/.test((e.target||{}).tagName||'')||e.ctrlKey||e.metaKey||e.altKey||!$('#mo').hidden||(S.shop.pin&&!unlocked))return;if(e.key==='n'){e.preventDefault();partyM()}else if(e.key==='/'){e.preventDefault();tab='cust';render();const s=$('#sq');s&&s.focus()}else if(e.key==='e'){e.preventDefault();quickM()}else if(e.key==='?')toast('Shortcuts: N = new customer · E = quick entry · / = search')});

const pobj=p=>({v:1,shop:{name:S.shop.name,upi:S.shop.upi,phone:S.shop.phone,pm:S.shop.pm||'safe',mc:S.shop.mc||''},name:p.name,bal:bal(p.id),entries:ents(p.id).map(e=>({id:e.id,type:e.type,kind:e.kind||'',amt:e.amt,date:e.date,note:e.note||'',edited:!!e.edited,due:e.due||''})),claims:S.claims.filter(c=>c.pid===p.id).slice(-8).map(c=>({amt:c.amt,date:c.date,status:c.status})),disputes:S.disputes.filter(d=>d.pid===p.id).map(d=>({eid:d.eid,status:d.status,reason:d.reason,reply:d.reply||'',claim:d.claim}))});

/* ===== Multi-device data sync (Firestore collection "sync") ===== */
const SC='sync',DP=()=>'projects/'+CF.projectId+'/databases/(default)/documents',SK={p:'parties',e:'entries',d:'disputes',c:'claims'};
let lastTs=0,didFull=false,pendR=false,syInfo='';
const ts=()=>{let n=Date.now()+(S.skew||0);if(n<=lastTs)n=lastTs+1;return lastTs=n},
 hs=r=>JSON.stringify(r,(k,v)=>k==='_u'?undefined:v),
 shopSub=()=>{const s=S.shop;return{name:s.name,upi:s.upi,phone:s.phone,pm:s.pm,mc:s.mc,intPct:s.intPct,graceDays:s.graceDays}},
 defShop=()=>{const s=S.shop;return s.name==='My Shop'&&!s.upi&&!s.phone},
 setSkew=j=>{const t=Date.parse(j&&(j.commitTime||j.updateTime));if(t)S.skew=t-Date.now()},
 recs=()=>{const o=[];for(const k in SK)(S[SK[k]]||[]).forEach(r=>o.push([k+'_'+r.id,k,r]));return o};
function stamp(){S.sy=S.sy||{};S.st=S.st||{};
 for(const[key,k,r]of recs()){const h=hs(r);if(S.st[key]!==h){r._u=ts();S.st[key]=h}else if(r._u==null)r._u=ts()}
 const h=JSON.stringify(shopSub());if(S.st.shop!==h){S.shop._u=(S.shop._u==null&&defShop())?0:ts();S.st.shop=h}}
function applyDoc(d){const f=d.fields||{},g=x=>(f[x]||{}).stringValue||'',u=+((f.u||{}).integerValue||0),k=g('k'),key=decodeURIComponent(d.name.split('/').pop());let data;try{data=JSON.parse(g('d'))}catch(e){return false}
 if((S.purge||[]).includes(key))return false;
 if(k==='meta'){const ra=+data.resetAt||0;if(ra<=(S.resetAt||0))return false;S.resetAt=ra;
  for(const kk in SK)S[SK[kk]]=(S[SK[kk]]||[]).filter(r=>{const keep=(r._u||0)>=ra;if(!keep){delete S.st[kk+'_'+r.id];delete S.sy[kk+'_'+r.id]}return keep});return true}
 if(u<(S.resetAt||0))return false;
 if(k==='shop'){if((S.shop._u||0)>=u)return false;Object.assign(S.shop,data);S.shop._u=u;S.st.shop=S.sy.shop=JSON.stringify(shopSub());return true}
 const a=S[SK[k]];if(!a||!data.id)return false;const i=a.findIndex(x=>x.id===data.id);if(i>=0&&(a[i]._u||0)>=u)return false;
 data._u=u;if(i>=0)a[i]=data;else a.push(data);S.st[key]=S.sy[key]=hs(data);return true}
async function pullData(full){let from=(full||!S.lp)?0:Math.max(0,S.lp-6e5),docs=[],mx=S.lp||0;
 for(;;){const j=await fsReq('POST',FS()+':runQuery',{structuredQuery:{from:[{collectionId:SC}],where:{fieldFilter:{field:{fieldPath:'u'},op:'GREATER_THAN',value:{integerValue:String(from)}}},orderBy:[{field:{fieldPath:'u'},direction:'ASCENDING'}],limit:300}});
  const ds=(Array.isArray(j)?j:[]).filter(x=>x.document).map(x=>x.document);docs.push(...ds);if(ds.length<300)break;from=+ds[ds.length-1].fields.u.integerValue}
 const isM=d=>((d.fields.k||{}).stringValue)==='meta';let ch=false;
 for(const d of docs.filter(isM))ch=applyDoc(d)||ch;
 for(const d of docs.filter(d=>!isM(d))){ch=applyDoc(d)||ch}
 for(const d of docs){const u=+((d.fields.u||{}).integerValue||0);if(u>mx)mx=u}
 S.lp=mx;syInfo='cloud docs: '+docs.length;return ch}
async function pushData(){const w=[],ks=[],sy=S.sy,mk=(key,k,data,u)=>({update:{name:DP()+'/'+SC+'/'+encodeURIComponent(key),fields:{k:{stringValue:k},d:{stringValue:JSON.stringify(data)},u:{integerValue:String(u)}}}});
 for(const[key,k,r]of recs()){const h=hs(r);if(sy[key]!==h){w.push(mk(key,k,r,r._u));ks.push([key,h])}}
 const sh=JSON.stringify(shopSub());if(sy.shop!==sh&&S.shop._u>0){w.push(mk('shop','shop',shopSub(),S.shop._u));ks.push(['shop',sh])}
 if(S.metaDirty){w.push(mk('meta','meta',{resetAt:S.resetAt},S.resetAt));ks.push(['meta',null])}
 for(let i=0;i<w.length;i+=200){const j=await fsReq('POST',FS()+':commit',{writes:w.slice(i,i+200)});setSkew(j);ks.slice(i,i+200).forEach(([key,h])=>{if(key==='meta')S.metaDirty=false;else sy[key]=h});save0()}
 return w.length}
async function syncData(manual){stamp();let ch=false;
 try{ch=await pullData(manual||!didFull);didFull=true}catch(e){if(/403/.test(e.message))throw new Error('Firestore rules do not allow "sync" yet - add the rule from the guide');throw e}
 stamp();try{const n=await pushData();syInfo+=', sent: '+n+', here: '+S.parties.length+' customers / '+S.entries.length+' entries'}catch(e){if(/403/.test(e.message))throw new Error('Firestore rules do not allow writing "sync" yet - add the rule from the guide');throw e}
 S.lastSync=Date.now();save0();return ch}
function afterRemote(){const t=(document.activeElement||{}).tagName||'';if(!$('#mo').hidden||/INPUT|TEXTAREA|SELECT/.test(t)){pendR=true;return}pendR=false;render()}
function sched(){if(!ready())return;clearTimeout(ptm);ptm=setTimeout(()=>syncAll(),1500)}
async function syncAll(manual){if(busy){clearTimeout(ptm);ptm=setTimeout(()=>syncAll(manual),2000);return}busy=true;
 try{cs('Syncing…');if((S.purge||[]).length)await purgeFlush();const rch=await syncData(manual);if(rch||pendR)afterRemote();let n=0;for(const p of S.parties){p.token=p.token||tk();
  if(p.del){if(pushed[p.id]!=='x'){await fsReq('DELETE',FS()+'/pub/'+p.token);pushed[p.id]='x'}continue}
  const o=pobj(p),h=JSON.stringify(o);if(pushed[p.id]===h)continue;
  await fsReq('PATCH',FS()+'/pub/'+p.token,{fields:{d:{stringValue:JSON.stringify({...o,upd:new Date().toISOString()})}}});pushed[p.id]=h;n++}
  save0();const g=await pullReports();if(g){await syncData();setTimeout(sched,300)}cs('Synced '+new Date().toLocaleTimeString()+' ('+syInfo+')'+(g?' · '+g+' new report(s)':''));if(manual)toast('Online sync done')}
 catch(e){cs('Sync failed: '+e.message);if(manual)toast('Sync failed: '+e.message)}busy=false}
async function pullReports(){const j=await fsReq('GET',FS()+'/reports?pageSize=200');let n=0;
 for(const d of j.documents||[]){const f=d.fields||{},g=k=>(f[k]||{}).stringValue||'',id=d.name.split('/').pop(),p=S.parties.find(x=>x.token&&x.token===g('t')&&!x.del),e=p&&S.entries.find(x=>x.id===g('eid')&&x.pid===p.id&&!x.del),cm=g('claim');
  if(p&&g('eid')==='PAY'){const am=Math.round(+cm*100)/100;if(am>0&&am<=1e7&&!S.claims.some(x=>x.id===id)){S.claims.push({id,pid:p.id,amt:am,note:g('note').slice(0,40),date:g('date')||new Date().toISOString(),status:'pending'});n++;log('Online payment claim from '+p.name);save0()}}
  else if(p&&e&&!S.disputes.some(x=>x.id===id)&&(cm===''||+cm>=0)){S.disputes.push({id,eid:e.id,pid:p.id,reason:g('reason').slice(0,100),claim:cm===''?null:Math.round(+cm*100)/100,note:g('note').slice(0,500),status:'pending',reply:'',date:g('date')||new Date().toISOString()});n++;log('Online report from '+p.name);save0()}
  await fsReq('DELETE','https://firestore.googleapis.com/v1/'+d.name)}
 if(n){render()}return n}
function saveC(){const em=$('#c1').value.trim(),pw=$('#c2').value,st=$('#c3').value.trim();if(!em||!pw)return toast('Enter admin email and password');if(st&&!/^https:\/\/.+/.test(st))return toast('Site URL must start with https://');
 cl().email=em;cl().site=st&&!st.endsWith('/')?st+'/':st;sessionStorage.setItem('kp_pw',pw);lss('kp_rt',null);cTok=null;pushed={};didFull=false;save0();syncAll(true)}
const siteOk=()=>/^https?:\/\//.test(site()),
 cLink=p=>{if(!siteOk())return '';if(!p.token){p.token=tk();save0()}return site()+'index.html#'+p.token},
 linkMsg=p=>{p.token=p.token||tk();return `Namaste ${p.name} ji 🙏\nApna hisaab dekhein aur poora ya thoda payment karein:\n${site()}index.html#${p.token}\n\n- ${S.shop.name}`};

function syncNow(){syncAll(true).then(()=>linksM())}
function linksM(){const a=live().filter(p=>dg(p.phone).length>=10);a.forEach(p=>{p.token=p.token||tk()});save0();
 openM(`<h3>Send customer links</h3><p class="k">Every customer has a different private link. Tap WhatsApp next to a name – the message is ready, you only press Send.</p>${ready()?`<div class="row"><span class="k">${esc(cState||'Online sync connected')}</span><button onclick="syncNow()">Sync now</button></div>`:'<p class="k due">Online sync is not connected yet. Connect it in Settings first, or the links will not open.</p>'}${siteOk()?'':'<p class="k due">Customer site URL is not set (Settings → Online customer links). Links will be wrong until you set it.</p>'}${a.length?a.map(p=>`<div class="card row"><div><b>${esc(p.name)}</b> <span class="chip sc"${p.linkSent?'':' hidden'}>Sent</span> ${pushed[p.id]&&pushed[p.id]!=='x'?'<span class="chip">Online</span>':'<span class="chip w">Not synced</span>'}<div class="k">${esc(p.phone)}</div></div><div class="wrap"><a class="btn" target="_blank" rel="noopener" onclick="markSent('${p.id}',this)" href="https://wa.me/${wan(p.phone)}?text=${encodeURIComponent(linkMsg(p))}">WhatsApp</a><button onclick="cp(linkMsg(P('${p.id}')))">Copy</button></div></div>`).join(''):'<p class="k">No customers with a phone number yet.</p>'}<button onclick="closeM()">Close</button>`);sched()}

 openM(`<h3>Customer link</h3><p class="k">Private link for ${esc(p.name)}. Send it only to them.</p>${ready()?'':'<p class="k due">Online sync is not connected yet. Connect it in Settings so this link works.</p>'}${siteOk()?'':'<p class="k due">Customer site URL is not set in Settings.</p>'}<textarea id="lk1" rows="5" readonly>${esc(t)}</textarea><div class="wrap"><a class="btn" target="_blank" rel="noopener" onclick="markSent('${id}',this)" href="https://wa.me/${wan(p.phone)}?text=${encodeURIComponent(t)}">WhatsApp</a><button onclick="cp($('#lk1').value)">Copy</button><button class="dng" onclick="newTok('${id}')">New link (disables old)</button><button onclick="openP('${id}')">Back</button></div>`);sched()}
