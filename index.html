 ${canPay?`<div class="card np"><b>${t('payh')}</b><p class="k">${t('partnote')}</p><label for="pa">${t('payamt')}</label><input id="pa" type="number" inputmode="decimal" min="1" max="${b}" step="0.01" value="${PAYAMT}" oninput="amtIn(this.value)"><div class="wrap"><button onclick="setAmt(${b})">${t('full')} ${fmt(b)}</button>${half>=1?`<button onclick="setAmt(${half})">${t('half')} ${fmt(half)}</button>`:''}</div><p class="due k" id="pe"></p><p class="k">${t('scan')}</p><div id="pq"></div><p><a class="btn" id="pu" href="${esc(upiUrl(PAYAMT))}">${t('pay')}</a></p><div class=\"wrap\">${Object.keys(APPS).map(k=>`<a class=\"btn\" id=\"${k}\">${APPS[k][0]}</a>`).join('')}<button onclick=\"copyUpi()\">${LG==='hi'?'UPI ID कॉपी करें':'Copy UPI ID'}</button></div><p class=\"k\">${LG==='hi'?'अगर ऐप में error आए: ऊपर से सीधे ऐप चुनें, या QR का screenshot लेकर ऐप में Gallery से स्कैन करें, या UPI ID कॉपी करके खुद भेजें।':'If an app shows an error: pick the app directly above, or screenshot the QR and scan it from the app gallery, or copy the UPI ID and pay manually.'}</p><p><button class="pri" onclick="paidM()">${t('paid')}</button></p></div>`:''}
 ${(cl.length||loc.length)?`<h3>${t('pays')}</h3>${loc.map(x=>`<div class="card row"><div><b>${fmt(x.amt)}</b><div class="k">${esc(new Date(x.date).toLocaleString())}</div></div><span class="chip w">${t('wait')}</span></div>`).join('')}${[...cl].reverse().map(c=>`<div class="card row"><div><b>${fmt(c.amt)}</b><div class="k">${esc(new Date(c.date).toLocaleString())}</div></div><span class="chip ${c.status==='confirmed'?'':'w'}">${esc(stl(c.status))}</span></div>`).join('')}`:''}
 <h3>${t('entries')}</h3>${L.map(e=>{const mine=ds.filter(x=>x.eid===e.id),d=mine[mine.length-1],pend=(d&&d.status==='pending')||sd.includes(e.id+'@'+mine.length);
  return `<div class="card row"><div><b class="${e.type==='give'?'due':'adv'}">${lb(e)} ${fmt(e.amt)}</b>${e.edited?' <span class="chip">'+t('corr')+'</span>':''}<div class="k">${esc(e.date)} ${esc(e.note)}</div></div>${pend?'<span class="chip w np">'+t('review')+'</span>':`<button class="np" onclick="reportM('${esc(e.id)}')">${t('rep')}</button>`}</div>`}).join('')||'<p class="k">'+t('none')+'</p>'}
 <h3 class="np">${t('reps')}</h3><div class="np">${ds.map(x=>`<div class="card"><span class="chip ${x.status==='pending'?'w':''}">${esc(x.status==='approved'?t('st_approved'):x.status==='rejected'?t('st_rejected2'):t('st_pending'))}</span> ${esc(x.reason)}${x.reply?'<div class="k">'+t('reply')+esc(x.reply)+'</div>':''}</div>`).join('')||'<p class="k">'+t('norep')+'</p>'}</div><p class="k">${t('upd')}${esc(new Date(D.upd).toLocaleString())}</p>`;
 if(canPay&&PAYAMT>=1){drawQr(upiUrl(PAYAMT));setApps(upiUrl(PAYAMT))}}
function paidM(){if(!(PAYAMT>=1))return toast(t('okamt'));
 openM(`<h3>${t('pm')}${PAYAMT}</h3><p class="k">${t('pmnote')}</p><label>${t('payamt')}</label><input id="p1" type="number" inputmode="decimal" min="1" max="${r2(D.bal)}" step="0.01" value="${PAYAMT}"><label>${t('ref')}</label><input id="p2" maxlength="40"><div class="wrap"><button class="pri" id="pb" onclick="sendP()">${t('sendp')}</button><button onclick="closeM()">${t('cancel')}</button></div>`)}
async function post(f){const r=await fetch(`${url()}/reports?key=${CF.apiKey}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({fields:Object.fromEntries(Object.entries(f).map(([k,v])=>[k,{stringValue:String(v)}]))})});if(!r.ok)throw 0}
async function sendP(){const a=r2($('#p1').value);if(!(a>=1&&a<=r2(D.bal)))return toast(t('badamt')+r2(D.bal));const b=$('#pb');b.disabled=true;const dt=new Date().toISOString();
 try{await post({t:T,eid:'PAY',reason:'Payment made',claim:a,note:$('#p2').value.trim().slice(0,40),date:dt});const l=lsGet(PAYK);l.push({amt:a,date:dt});lsSet(PAYK,l);closeM();view();toast(t('pdone'))}
 catch(e){b.disabled=false;toast(t('fail'))}}
function reportM(eid){const e=D.entries.find(x=>x.id===eid);if(!e)return;openM(`<h3>${t('rwh')}</h3><p>${e.type==='give'?t('took'):t('paid2')} ${fmt(e.amt)} · ${esc(e.date)}</p><label>${t('wrong')}</label><select id="d1">${[['Wrong amount','w1'],['I did not take this','w2'],['Already paid','w3'],['Duplicate entry','w4'],['Other','w5']].map(([v,k])=>`<option value="${v}">${t(k)}</option>`).join('')}</select><label>${t('ca')}</label><input id="d2" type="number" min="0" step="0.01"><label>${t('msg')}</label><textarea id="d3" maxlength="400"></textarea><div class="wrap"><button class="pri" id="sb" onclick="sendR('${esc(eid)}')">${t('send')}</button><button onclick="closeM()">${t('cancel')}</button></div>`)}
async function sendR(eid){const c=$('#d2').value;if(c!==''&&!(+c>=0))return toast(t('okamt'));const b=$('#sb');b.disabled=true;
 try{await post({t:T,eid,reason:$('#d1').value,claim:c===''?'':r2(c),note:$('#d3').value.trim().slice(0,400),date:new Date().toISOString()});
  const s=sent();s.push(eid+'@'+(D.disputes||[]).filter(x=>x.eid===eid).length);lsSet(SENT,s);closeM();view();toast(t('sent'))}
 catch(e){b.disabled=false;toast(t('fail'))}}
load();
</script></body></html>
